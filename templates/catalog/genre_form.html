{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-3">
                    {% if object %}
                        Edit genre
                    {% else %}
                        Add genre
                    {% endif %}
                </h1>

                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}

                    <button type="submit" class="btn btn-primary">
                        Save
                    </button>

                    <button
                        type="button"
                        onclick="history.back()"
                        class="btn btn-outline-secondary"
                    >
                        Cancel
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
