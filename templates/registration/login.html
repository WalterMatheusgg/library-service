{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card form-page-card">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="hero-badge">
                        Acesso ao sistema
                    </span>
                    <h1 class="h3 fw-bold">Entrar na Biblioteca Digital</h1>
                    <p class="text-muted mb-0">
                        Use seu usuário e senha para gerenciar o acervo.
                    </p>
                </div>

                {% if form.errors %}
                    <div class="alert alert-danger">
                        Usuário ou senha inválidos.
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label" for="{{ form.username.id_for_label }}">
                            Usuário
                        </label>
                        <input
                            type="text"
                            name="{{ form.username.html_name }}"
                            id="{{ form.username.id_for_label }}"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="{{ form.password.id_for_label }}">
                            Senha
                        </label>
                        <input
                            type="password"
                            name="{{ form.password.html_name }}"
                            id="{{ form.password.id_for_label }}"
                            class="form-control"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Entrar
                    </button>
                </form>

                <div class="text-center mt-3">
                    <a href="{% url 'catalog:index' %}" class="text-decoration-none">
                        Voltar para a página inicial
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
